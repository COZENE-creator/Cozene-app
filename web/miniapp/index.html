<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cozene</title>
  <link rel="stylesheet" href="miniapp.css" />
</head>
<body>
  <!-- Cozene LINE Mini App — one app for every partner store.
       Opened from https://miniapp.line.me/<LIFF_ID>?store=<slug>[&table=<no>] -->

  <div id="boot" class="boot"><div class="spinner"></div></div>
  <div id="fatal" class="fatal" hidden></div>

  <main id="app" hidden>
    <!-- Home: store introduction (no login) -->
    <section id="view-home" class="view">
      <div id="hero" class="hero">
        <div class="hero-text">
          <h1 id="storeName"></h1>
          <p id="storeTagline" class="tagline"></p>
        </div>
      </div>
      <div class="pad">
        <button id="tableCta" class="cta" hidden></button>
        <p id="storeConcept" class="concept"></p>
        <dl id="storeInfo" class="info"></dl>
        <div id="storePhotos" class="photos"></div>
      </div>
    </section>

    <!-- Menu (no login) -->
    <section id="view-menu" class="view" hidden>
      <nav id="menuNav" class="menu-nav"></nav>
      <div id="menuList" class="pad"></div>
      <p class="menu-foot pad" data-i18n="menu_foot">価格はすべて税込です。</p>
    </section>

    <!-- Member card (login + consent) -->
    <section id="view-member" class="view" hidden>
      <div class="pad">
        <div id="memberState" class="state" data-i18n="loading">読み込み中…</div>
        <div id="memberBody" hidden>
          <div class="member-card">
            <div class="mc-top">
              <span id="mcStore" class="mc-store"></span>
              <span class="mc-label" data-i18n="member_label">MEMBER</span>
            </div>
            <div id="mcName" class="mc-name"></div>
            <div class="mc-visits"><span id="mcCount">0</span><small id="mcCountLabel"></small></div>
            <div id="mcSince" class="mc-since"></div>
          </div>

          <div id="currentVisit" class="notice" hidden></div>

          <h2 class="section-title" data-i18n="benefits">特典</h2>
          <div id="benefitList"></div>

          <h2 class="section-title" data-i18n="privacy">プライバシー</h2>
          <label class="toggle-row">
            <span>
              <strong data-i18n="partner_title">提携店舗との共有</strong>
              <small data-i18n="partner_body">他のCozene提携レストランでもお客様を認識し、特典をお届けできるようになります。</small>
            </span>
            <input id="partnerToggle" type="checkbox" />
          </label>
        </div>
      </div>
    </section>
  </main>

  <nav id="tabs" class="tabs" hidden>
    <a href="#home" data-tab="home" data-i18n="tab_home">ホーム</a>
    <a href="#menu" data-tab="menu" data-i18n="tab_menu">メニュー</a>
    <a href="#member" data-tab="member" data-i18n="tab_member">会員証</a>
    <button id="langBtn" class="lang-btn" type="button" aria-label="Language">EN</button>
  </nav>

  <!-- Consent sheet -->
  <div id="consentSheet" class="sheet" hidden>
    <div class="sheet-panel">
      <h2 data-i18n="consent_title">ご利用の前に</h2>
      <p class="sheet-lead" data-i18n="consent_lead"></p>
      <ul class="consent-points">
        <li data-i18n="consent_point_store"></li>
        <li data-i18n="consent_point_use"></li>
        <li data-i18n="consent_point_stop"></li>
      </ul>
      <label class="check">
        <input id="consentStore" type="checkbox" />
        <span><span data-i18n="consent_store"></span> <em data-i18n="required"></em></span>
      </label>
      <label class="check">
        <input id="consentPartner" type="checkbox" />
        <span><span data-i18n="consent_partner"></span> <em data-i18n="optional"></em></span>
      </label>
      <p class="fineprint"><span data-i18n="policy_version"></span> <span id="policyVersion"></span></p>
      <button id="consentAgree" class="btn-primary" disabled data-i18n="consent_agree">同意して続ける</button>
      <button id="consentCancel" class="btn-text" data-i18n="not_now">今はしない</button>
    </div>
  </div>

  <!-- Check-in sheet -->
  <div id="checkinSheet" class="sheet" hidden>
    <div class="sheet-panel">
      <h2 id="ciTitle"></h2>
      <p class="sheet-lead" data-i18n="party_question">何名様でご来店ですか？</p>
      <div id="partyGrid" class="party-grid"></div>
      <button id="checkinGo" class="btn-primary" disabled data-i18n="check_in">チェックイン</button>
      <button id="checkinCancel" class="btn-text" data-i18n="cancel">キャンセル</button>
      <p id="checkinErr" class="err" hidden></p>
    </div>
  </div>

  <!-- Benefit pass: shown to staff -->
  <div id="pass" class="pass" hidden>
    <div class="pass-card">
      <div class="pass-store js-store-name"></div>
      <div class="pass-eyebrow" data-i18n="welcome_gift">ウェルカムギフト</div>
      <div id="passTitle" class="pass-title"></div>
      <div id="passGuest" class="pass-guest"></div>
      <div id="passClock" class="pass-clock"></div>
      <div class="pass-sheen"></div>
    </div>
    <div id="passDone" class="pass-done" hidden>
      <div class="done-mark">✓</div>
      <div class="done-title" data-i18n="enjoy">どうぞお楽しみください！</div>
      <div id="passDoneAt" class="done-at"></div>
    </div>

    <div id="pinPad" class="pin" hidden>
      <div class="pin-title" data-i18n="staff_pin">スタッフPIN</div>
      <div id="pinDots" class="pin-dots"></div>
      <div id="pinKeys" class="pin-keys"></div>
      <p id="pinErr" class="pin-err"></p>
    </div>

    <p id="passHint" class="pass-hint" data-i18n="pass_hint">この画面をスタッフにお見せください。時計が動いていることが有効な画面の印です。</p>
    <button id="passStaff" class="btn-light" data-i18n="staff_confirm">スタッフ確認</button>
    <button id="passClose" class="btn-text light" data-i18n="close">閉じる</button>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="../config.js"></script>
  <script src="miniapp.js"></script>
</body>
</html>
