<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozene Check-in</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
    }
    .card {
      width: min(420px, 90vw);
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .status { font-size: 16px; margin: 16px 0; min-height: 24px; }
    .spinner {
      width: 36px; height: 36px; margin: 8px auto;
      border: 4px solid #e0e0e0; border-top-color: #06c755;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok { color: #06c755; font-weight: 600; }
    .err { color: #e23744; font-weight: 600; }
    .detail { font-size: 12px; color: #888; word-break: break-all; margin-top: 12px; }
    button {
      margin-top: 16px; padding: 10px 20px; font-size: 14px;
      border: none; border-radius: 8px; background: #06c755; color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cozene</h1>
    <div id="spinner" class="spinner"></div>
    <div id="status" class="status">Checking you in…</div>
    <div id="detail" class="detail"></div>
    <button id="retry" hidden>Retry</button>
  </div>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- App config (copy config.example.js -> config.js) -->
  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
